<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" role="img" aria-label="Three illustrated Windows dialogs: Search for environment variables, choose user Path, then add the Flutter bin directory">
<defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#e7f7ff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="1100" height="355" rx="20" fill="#eaf3fa"/>
<g font-family="Arial,Segoe UI,sans-serif"><g transform="translate(18 22)"><rect width="331" height="310" rx="15" fill="url(#g)" stroke="#b8d1e4" stroke-width="2"/><rect width="331" height="42" rx="15" fill="#113954"/><text x="17" y="28" fill="white" font-size="18" font-weight="bold">1 · Windows Search</text><rect x="16" y="62" width="300" height="46" rx="11" fill="white" stroke="#1b9fcc" stroke-width="2"/><text x="27" y="91" fill="#23455f" font-size="16">environment variables</text><rect x="16" y="127" width="300" height="68" rx="9" fill="#e2f4ff" stroke="#1b9fcc"/><text x="28" y="154" fill="#163e58" font-size="16" font-weight="bold">Edit environment variables</text><text x="28" y="176" fill="#466982" font-size="13">for your account</text><text x="17" y="233" fill="#45677d" font-size="14">Open the matching Windows tool</text></g>
<g transform="translate(383 22)"><rect width="331" height="310" rx="15" fill="url(#g)" stroke="#b8d1e4" stroke-width="2"/><rect width="331" height="42" rx="15" fill="#113954"/><text x="17" y="28" fill="white" font-size="18" font-weight="bold">2 · User variables</text><text x="20" y="80" fill="#23455f" font-size="15" font-weight="bold">Variables for your account</text><rect x="18" y="100" width="290" height="115" rx="7" fill="white" stroke="#cedbe6"/><text x="34" y="127" fill="#426276" font-size="14">TEMP</text><rect x="22" y="143" width="282" height="34" rx="3" fill="#ceeefc" stroke="#1b9fcc"/><text x="34" y="165" fill="#114565" font-size="16" font-weight="bold">Path</text><text x="34" y="200" fill="#426276" font-size="14">USERNAME</text><rect x="198" y="232" width="111" height="39" rx="8" fill="#0f83b9"/><text x="222" y="258" fill="white" font-size="16" font-weight="bold">Edit...</text></g>
<g transform="translate(748 22)"><rect width="334" height="310" rx="15" fill="url(#g)" stroke="#b8d1e4" stroke-width="2"/><rect width="334" height="42" rx="15" fill="#113954"/><text x="17" y="28" fill="white" font-size="18" font-weight="bold">3 · Add Flutter bin</text><rect x="16" y="62" width="300" height="155" rx="7" fill="white" stroke="#cedbe6"/><text x="27" y="91" fill="#365466" font-size="14">%USERPROFILE%\AppData</text><text x="27" y="119" fill="#365466" font-size="14">C:\Windows\System32</text><rect x="22" y="139" width="288" height="56" rx="7" fill="#cff2e5" stroke="#1ba983" stroke-width="2"/><text x="32" y="161" fill="#075842" font-size="15" font-weight="bold">%USERPROFILE%\develop</text><text x="32" y="181" fill="#075842" font-size="15" font-weight="bold">\flutter\bin</text><rect x="19" y="231" width="100" height="40" rx="8" fill="#0f83b9"/><text x="46" y="257" fill="white" font-size="16" font-weight="bold">New</text><rect x="216" y="231" width="100" height="40" rx="8" fill="#107d68"/><text x="252" y="257" fill="white" font-size="16" font-weight="bold">OK</text></g>
</g></svg>