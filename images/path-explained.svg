<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#effaff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#123d68" flood-opacity=".1"/></filter></defs><rect width="1000" height="340" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="64" fill="#113b60" font-size="25" font-weight="bold">How does the terminal find Flutter?</text>
<rect x="36" y="94" width="292" height="154" rx="17" fill="#0e2a48"/><text x="56" y="132" fill="#69d8ff" font-size="17">PS C:\Users\Student&gt;</text><text x="56" y="166" fill="white" font-size="20" font-weight="bold">flutter --version</text><text x="56" y="213" fill="#a7d8f3" font-size="15">You type a command</text>
<path d="M335 166H405" stroke="#168bc0" stroke-width="5"/><path d="m395 157 13 9-13 9" fill="none" stroke="#168bc0" stroke-width="5"/>
<rect x="413" y="94" width="237" height="154" rx="17" fill="white" stroke="#8fcfe4" stroke-width="2"/><text x="434" y="130" fill="#113b60" font-size="21" font-weight="bold">PATH</text><text x="434" y="160" fill="#536984" font-size="15">List of folders the</text><text x="434" y="182" fill="#536984" font-size="15">terminal searches</text><text x="434" y="212" fill="#0076b6" font-size="15">...\flutter\bin</text>
<path d="M656 166H725" stroke="#168bc0" stroke-width="5"/><path d="m715 157 13 9-13 9" fill="none" stroke="#168bc0" stroke-width="5"/>
<rect x="731" y="94" width="234" height="154" rx="17" fill="#e8faf2" stroke="#8fcfba" stroke-width="2"/><text x="749" y="129" fill="#125943" font-size="21" font-weight="bold">Flutter found!</text><text x="749" y="164" fill="#3d6a5c" font-size="15">The command runs</text><text x="749" y="196" fill="#3d6a5c" font-size="15">and displays a version.</text>
<text x="43" y="289" fill="#536984" font-size="17">After adding PATH, close and reopen terminals so they read the updated settings.</text></g></svg>